services:
  codex-lb:
    build:
      context: ./source
      dockerfile: ../Dockerfile
      args:
        CODEX_LB_SOURCE_REVISION: c2a7bb600e051eefdc04d1a9e3646e0a569a6db1
    image: codex-lb:bootstrap-gpt61-c2a7bb60
    container_name: codex-lb
    environment:
      CODEX_LB_DATABASE_URL: postgresql+asyncpg://codex_lb:${POSTGRES_PASSWORD}@postgres:5432/codex_lb
      CODEX_LB_DATABASE_MIGRATE_ON_STARTUP: "true"
      #CODEX_LB_PROXY_ACCOUNT_STREAM_LIMIT: "0"
      #CODEX_LB_DISABLE_WEBSOCKETS: "true"
      #CODEX_LB_FORCE_HTTP_STREAM: "true"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2455:2455"
      - "1455:1455"
    volumes:
      - ./.data:/var/lib/codex-lb
    restart: always

  postgres:
    image: postgres:18-alpine
    container_name: codex-lb-postgres
    environment:
      POSTGRES_USER: codex_lb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codex_lb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_lb -d codex_lb"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./.data-postgres:/var/lib/postgresql
    restart: always
